name: build-and-test

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "gh-pages"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-editmode:
    name: Unity EditMode (${{ matrix.package_display_name }})
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - package_display_name: GridForge
            package_name: com.mrdav30.gridforge
            package_path: com.mrdav30.gridforge
            artifact_suffix: standard
          - package_display_name: GridForge Lean
            package_name: com.mrdav30.gridforge.lean
            package_path: com.mrdav30.gridforge.lean
            artifact_suffix: lean

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run package version self-test
        shell: pwsh
        run: |
          ./.assets/scripts/test-update-unity-package-versions.ps1

      - name: Validate package version config
        shell: pwsh
        run: |
          ./.assets/scripts/update-unity-package-versions.ps1 -ValidateOnly

      - name: Validate package sync
        shell: pwsh
        run: |
          ./.assets/scripts/test-gridforge-package-sync.ps1

      - name: Prepare Unity test project
        shell: pwsh
        run: |
          ./.assets/scripts/new-gridforge-ci-test-project.ps1 `
            -ProjectPath ".ci/unity-project" `
            -PackageName "${{ matrix.package_name }}" `
            -PackagePath "${{ matrix.package_path }}"

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: .ci/unity-project/Library
          key: unity-library-${{ runner.os }}-${{ matrix.artifact_suffix }}-${{ hashFiles('.assets/unity-package-versions.json', '.assets/scripts/new-gridforge-ci-test-project.ps1', 'Tests/EditMode/**/*.cs', 'Tests/EditMode/**/*.asmdef', 'com.mrdav30.gridforge/Plugins/**', 'com.mrdav30.gridforge/Runtime/**', 'com.mrdav30.gridforge/Editor/**', 'com.mrdav30.gridforge/package.json', 'com.mrdav30.gridforge.lean/Plugins/**', 'com.mrdav30.gridforge.lean/Runtime/**', 'com.mrdav30.gridforge.lean/Editor/**', 'com.mrdav30.gridforge.lean/package.json') }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ matrix.artifact_suffix }}-

      - name: Run Unity EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .ci/unity-project
          unityVersion: 6000.5.0f1
          customImage: unityci/editor:ubuntu-6000.5.0f1-base-3
          testMode: EditMode
          customParameters: -assemblyNames GridForge.Unity.Tests.EditMode -runSynchronously
          artifactsPath: artifacts/${{ matrix.artifact_suffix }}
          githubToken: ${{ github.token }}
          checkName: Unity EditMode ${{ matrix.package_display_name }}

      - name: Upload Unity test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unity-editmode-${{ matrix.artifact_suffix }}
          path: artifacts/${{ matrix.artifact_suffix }}

      - name: Setup .NET for API documentation
        if: matrix.artifact_suffix == 'standard'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Prepare API documentation references
        if: matrix.artifact_suffix == 'standard'
        shell: bash
        run: |
          set -euo pipefail

          image="unityci/editor:ubuntu-6000.5.0f1-base-3"
          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          mkdir -p .docs/api/obj/references
          for reference in UnityEngine.CoreModule UnityEngine.PhysicsModule UnityEngine.InputLegacyModule; do
            docker cp \
              "$container:/opt/unity/Editor/Data/Managed/UnityEngine/$reference.dll" \
              ".docs/api/obj/references/$reference.dll"
          done

          cp com.mrdav30.gridforge/Plugins/GridForge.dll \
            .docs/api/obj/references/GridForge.dll

          fixedmathsharp_package="$(find .ci/unity-project/Library/PackageCache \
            -mindepth 1 -maxdepth 1 -type d \
            -name 'com.mrdav30.fixedmathsharp@*' -print -quit)"
          test -n "$fixedmathsharp_package"
          cp "$fixedmathsharp_package/Plugins/FixedMathSharp.dll" \
            .docs/api/obj/references/FixedMathSharp.dll

          swiftcollections_package="$(find .ci/unity-project/Library/PackageCache \
            -mindepth 1 -maxdepth 1 -type d \
            -name 'com.mrdav30.swiftcollections@*' -print -quit)"
          test -n "$swiftcollections_package"
          cp "$swiftcollections_package/Plugins/SwiftCollections.dll" \
            .docs/api/obj/references/SwiftCollections.dll

          cp .ci/unity-project/Library/ScriptAssemblies/FixedMathSharp.Runtime.dll \
            .docs/api/obj/references/FixedMathSharp.Runtime.dll
          cp .ci/unity-project/Library/ScriptAssemblies/SwiftCollections.Runtime.dll \
            .docs/api/obj/references/SwiftCollections.Runtime.dll

      - name: Build API documentation
        if: matrix.artifact_suffix == 'standard'
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool restore
          dotnet tool run docfx .docs/api/docfx.json --warningsAsErrors

          test -f .docs/api/obj/_site/index.html
          test -f .docs/api/obj/_site/guides/getting-started.html
          test -f .docs/api/obj/_site/guides/grid-authoring.html
          test -f .docs/api/obj/_site/guides/scene-tools.html
          test -f .docs/api/obj/_site/guides/package-maintenance.html
          test -f .docs/api/obj/_site/api/GridForge.html
          test -f .docs/api/obj/_site/api/GridForge.Unity.html
          test -f .docs/api/obj/_site/api/GridForge.Unity.GridWorldComponent.html
          test -f .docs/api/obj/_site/api/GridForge.Blockers.BlockerComponent.html
          test -f .docs/api/obj/_site/api/GridForge.Configuration.SerializableGridConfiguration.html
          test -f .docs/api/obj/_site/api/GridForge.Utility.GridDebugger.html
          test -f .docs/api/obj/_site/assets/icon.png
          test -f .docs/api/obj/_site/public/main.css
          test -f .docs/api/obj/_site/public/main.js
          grep -Fq 'gf-hero' .docs/api/obj/_site/index.html
          grep -Fq -- '--gf-cyan-rgb' .docs/api/obj/_site/public/main.css
          grep -Fq 'github.com/mrdav30/GridForge-Unity' .docs/api/obj/_site/public/main.js
          grep -Fq 'mrdav30.github.io/GridForge/' .docs/api/obj/_site/api/GridForge.html

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          site = Path(".docs/api/obj/_site").resolve()
          broken = []

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          for page in site.rglob("*.html"):
              parser = Links()
              parser.feed(page.read_text(encoding="utf-8"))
              for href in parser.hrefs:
                  parsed = urlsplit(href)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue

                  path = unquote(parsed.path)
                  target = site / path.lstrip("/") if path.startswith("/") else page.parent / path
                  target = target.resolve()
                  if target.is_dir():
                      target /= "index.html"
                  if not target.exists():
                      broken.append(f"{page.relative_to(site)} -> {href}")

          if broken:
              raise SystemExit("Broken local links:\n" + "\n".join(sorted(broken)))
          PY

      - name: Upload API documentation site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.artifact_suffix == 'standard'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .docs/api/obj/_site

  unity-sample-import-smoke:
    name: Unity Sample Import Smoke (${{ matrix.package_display_name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - package_display_name: GridForge
            package_name: com.mrdav30.gridforge
            package_path: com.mrdav30.gridforge
            expected_sample_asmdef: GridForge.Samples.asmdef
            artifact_suffix: standard
          - package_display_name: GridForge Lean
            package_name: com.mrdav30.gridforge.lean
            package_path: com.mrdav30.gridforge.lean
            expected_sample_asmdef: GridForge.Lean.Samples.asmdef
            artifact_suffix: lean

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Unity sample import smoke project
        shell: pwsh
        run: |
          ./.assets/ci/scripts/prepare-unity-sample-import-smoke.ps1 `
            -ProjectPath ".ci/unity-sample-import-${{ matrix.artifact_suffix }}" `
            -PackageName "${{ matrix.package_name }}" `
            -PackagePath "${{ matrix.package_path }}" `
            -ExpectedSampleAsmdef "${{ matrix.expected_sample_asmdef }}" `
            -WorkspacePath "/github/workspace" `
            -GitSha "$env:GITHUB_SHA"

      - name: Cache Unity sample import Library
        uses: actions/cache@v5
        with:
          path: .ci/unity-sample-import-${{ matrix.artifact_suffix }}/Library
          key: unity-sample-import-library-${{ runner.os }}-${{ matrix.artifact_suffix }}-${{ hashFiles('.assets/unity-package-versions.json', '.assets/ci/scripts/prepare-unity-sample-import-smoke.ps1', '.assets/ci/unity-sample-import-smoke/**', 'com.mrdav30.gridforge/Plugins/**', 'com.mrdav30.gridforge/Runtime/**', 'com.mrdav30.gridforge/Editor/**', 'com.mrdav30.gridforge/package.json', 'com.mrdav30.gridforge/Samples~/**', 'com.mrdav30.gridforge.lean/Plugins/**', 'com.mrdav30.gridforge.lean/Runtime/**', 'com.mrdav30.gridforge.lean/Editor/**', 'com.mrdav30.gridforge.lean/package.json', 'com.mrdav30.gridforge.lean/Samples~/**') }}
          restore-keys: |
            unity-sample-import-library-${{ runner.os }}-${{ matrix.artifact_suffix }}-

      - name: Trust local Git checkout inside Unity container
        shell: bash
        run: |
          set -euo pipefail

          container_home="$RUNNER_TEMP/_github_home"
          mkdir -p "$container_home"

          git config --file "$container_home/.gitconfig" --add safe.directory /github/workspace
          git config --file "$container_home/.gitconfig" --add safe.directory /github/workspace/.git

      - name: Run Unity sample import smoke
        id: sample-import
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .ci/unity-sample-import-${{ matrix.artifact_suffix }}
          unityVersion: 6000.5.0f1
          customImage: unityci/editor:ubuntu-6000.5.0f1-base-3
          testMode: EditMode
          customParameters: -assemblyNames GridForge.SampleImportSmokeTests -runSynchronously
          artifactsPath: artifacts/sample-import-${{ matrix.artifact_suffix }}
          githubToken: ${{ github.token }}
          checkName: Unity Sample Import ${{ matrix.package_display_name }}

      - name: Scan Unity sample import log
        if: always() && steps.sample-import.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail

          bash .assets/ci/scripts/scan-unity-sample-import-log.sh \
            "artifacts/sample-import-${{ matrix.artifact_suffix }}/editmode.log"

      - name: Upload Unity sample import artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unity-sample-import-${{ matrix.artifact_suffix }}
          path: artifacts/sample-import-${{ matrix.artifact_suffix }}

  deploy-docs:
    name: Deploy API documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unity-editmode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy API documentation
        id: deployment
        uses: actions/deploy-pages@v5
